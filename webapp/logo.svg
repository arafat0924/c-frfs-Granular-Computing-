<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="C-FRFS">
  <title>C-FRFS</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7db2ff"/>
      <stop offset="1" stop-color="#2255d4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="30" rx="17" fill="url(#gloss)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="16.5" fill="none" stroke="#fff" stroke-opacity=".35"/>
  <!-- four columns: the one that stays under the dashed 50% line is dropped by the vote -->
  <rect x="12" y="38" width="8" height="12" rx="3" fill="#fff" fill-opacity=".45"/>
  <rect x="23" y="21" width="8" height="29" rx="3" fill="#fff"/>
  <rect x="34" y="14" width="8" height="36" rx="3" fill="#fff"/>
  <rect x="45" y="26" width="8" height="24" rx="3" fill="#fff"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#0e2a6b" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3.5 3.5"/>
</svg>
